# The Exercise Animatic library grows by itself (Ruth, 2026-09-17). Weekly since
# the same day: the vendor releases most weeks, and a clip should not wait a month.
# See scripts/monthly-animatic-sync.mjs for what each run does.
name: Weekly Exercise Animatic sync

on:
  schedule:
    # 09:00 UTC every Friday. The vendor's releases have landed Tuesday to
    # Thursday, so Friday picks up that week's.
    - cron: '0 9 * * 5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report only, change nothing'
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: npm ci
      - name: Run sync
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/monthly-animatic-sync.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
